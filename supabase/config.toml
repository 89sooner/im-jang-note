# 임장노트 Supabase 로컬/CI 구성 (supabase CLI)
# 실제 dev/prod 프로젝트는 별도(infrastructure_operations.md §2). 이 파일은 로컬 개발/마이그레이션용.
project_id = "imjang-note"

[api]
enabled = true
port = 54321
schemas = ["public"]
extra_search_path = ["public"]
max_rows = 1000

[db]
port = 54322
shadow_port = 54320
major_version = 15

[studio]
enabled = true
port = 54323

[auth]
enabled = true
site_url = "imjangnote://"
additional_redirect_urls = ["imjangnote://", "exp://"]
jwt_expiry = 3600
enable_refresh_token_rotation = true
enable_signup = true

[auth.email]
enable_signup = true
enable_confirmations = false   # 로컬 개발 편의. prod는 true 권장(NFR-002).

[realtime]
enabled = true
